camera_node:
  ros__parameters:
    port: 5000
    meta_port: -1  # -1 → port+1 (UCAL1 sideband); 0 disables
    image_topic: "/camera/image_raw"
    frame_id: "camera_optical_frame"
    # auto = prefer stream meta, optional calib_file fallback
    calib_source: "auto"
    calib_file: "example_calib.yaml"
    stream_undistorted: false
    udp_buffer_size: 212992
    queue_size: 1
    qos_reliability: "best_effort"
    jitter_latency_ms: 80
    stall_timeout_ms: 1500
    reconnect_delay_ms: 400
    read_timeout_ms: 250
    # auto tries vah264dec → nvh264dec → avdec_h264
    h264_decoder: "auto"
